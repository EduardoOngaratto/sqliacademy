<!DOCTYPE html>
<!--
    Layout base de todas as paginas.
    Uso na pagina: <html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">SQLi Academy</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/fragments :: navbar}"></nav>

<div class="flex-grow-1">
    <main th:replace="${conteudo}">Conteúdo da página</main>
</div>

<footer th:replace="~{layout/fragments :: rodape}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
