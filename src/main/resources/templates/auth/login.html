<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Entrar · SQLi Academy</title>
</head>
<body>
<main class="container auth-wrapper">
    <div class="card auth-card">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <span class="icon-box icon-box-lg mb-3"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i></span>
                <h1 class="h3 mb-1">Entrar</h1>
                <p class="text-body-secondary mb-0">Continue de onde parou na trilha.</p>
            </div>

            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <!-- Mensagem generica: nao revela se o e-mail existe ou se a conta esta inativa -->
            <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus
                           autocomplete="username">
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required
                           autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
            </form>

            <p class="mt-4 mb-0 text-center small">
                Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
