<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Entrar · SQLi Academy</title>
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <h1 class="h3 mb-4">Entrar</h1>

            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <!-- Mensagem generica: nao revela se o e-mail existe ou se a conta esta inativa -->
            <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <p class="mt-3 text-center">
                Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
