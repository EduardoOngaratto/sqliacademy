<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="|${progresso.modulo.titulo} · SQLi Academy|">Módulo · SQLi Academy</title>
</head>
<body>
<main class="container py-4 py-md-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/trilha}">Trilha</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${progresso.modulo.titulo}">Módulo</li>
        </ol>
    </nav>

    <div class="page-header d-flex gap-3 align-items-start">
        <span class="modulo-numero" th:text="${progresso.modulo.ordem}">1</span>
        <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <h1 class="h3 mb-1" th:text="|Módulo ${progresso.modulo.ordem} — ${progresso.modulo.titulo}|">Módulo</h1>
                <span th:replace="~{layout/fragments :: status(${progresso.status})}"></span>
            </div>
            <p class="page-subtitle" th:text="${progresso.modulo.descricao}"></p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <h2 class="h5 mb-3" th:text="|Conteúdos (${progresso.conteudosLidos} de ${progresso.totalConteudos} lidos)|">Conteúdos</h2>
            <div class="list-group">
                <a th:each="c : ${conteudos}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2 py-3"
                   th:href="@{/conteudos/{id}(id=${c.id})}"
                   th:with="lido=${idsConcluidos.contains(c.id)}">
                    <span class="d-flex align-items-center gap-2">
                        <i class="bi" aria-hidden="true"
                           th:classappend="${lido} ? 'bi-check-circle-fill text-success' : 'bi-file-earmark-text text-body-secondary'"></i>
                        <span th:text="${c.titulo}">Conteúdo</span>
                    </span>
                    <span th:if="${lido}" class="text-success small fw-semibold">✓ Lido</span>
                    <i th:unless="${lido}" class="bi bi-chevron-right text-body-secondary" aria-hidden="true"></i>
                </a>
                <div th:if="${#lists.isEmpty(conteudos)}" class="list-group-item text-body-secondary">
                    Nenhum conteúdo cadastrado.
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <h2 class="h5 mb-3">Prática</h2>
            <div class="card">
                <div class="card-body p-4">
                    <div class="d-flex gap-3 align-items-start mb-3">
                        <span class="icon-box"><i class="bi bi-terminal" aria-hidden="true"></i></span>
                        <div>
                            <h3 class="h6 mb-1"
                                th:text="${laboratorio != null} ? |Laboratório: ${laboratorio.titulo}| : 'Laboratório'">Laboratório</h3>
                            <span class="status" th:classappend="${progresso.labResolvido} ? 'status-concluido' : 'status-pendente'">
                                <i class="bi" aria-hidden="true"
                                   th:classappend="${progresso.labResolvido} ? 'bi-check-circle-fill' : 'bi-hourglass-split'"></i><span
                                    th:text="${progresso.labResolvido} ? 'Resolvido' : 'Pendente'">Pendente</span>
                            </span>
                        </div>
                    </div>
                    <a th:if="${labDisponivel}" class="btn btn-primary w-100"
                       th:href="@{/laboratorios/{codigo}(codigo=${laboratorio.codigo})}">
                        Acessar <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
                    </a>
                    <button th:unless="${labDisponivel}" type="button" class="btn btn-outline-secondary w-100"
                            disabled>Disponível em breve</button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
