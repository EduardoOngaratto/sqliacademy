<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="|${conteudo.titulo} · SQLi Academy|">Conteúdo · SQLi Academy</title>
</head>
<body>
<main class="container py-4 py-md-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/trilha}">Trilha</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/modulos/{id}(id=${conteudo.modulo.id})}" th:text="${conteudo.modulo.titulo}">Módulo</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${conteudo.titulo}">Conteúdo</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-4">
                <h1 class="h3 mb-0" th:text="${conteudo.titulo}">Conteúdo</h1>
                <span th:if="${concluido}" class="status status-concluido">
                    <i class="bi bi-check-circle-fill" aria-hidden="true"></i><span>Concluído</span>
                </span>
            </div>

            <!-- HTML da carga inicial (confiavel). Codigo em <pre><code class="language-sql|language-java"> -->
            <article class="conteudo-texto" th:utext="${conteudo.corpo}"></article>
        </div>
        <div class="card-footer bg-transparent p-3 p-md-4 d-flex flex-wrap gap-2">
            <form method="post" th:action="@{/conteudos/{id}/concluir(id=${conteudo.id})}">
                <button type="submit" class="btn btn-primary" th:disabled="${concluido}"
                        th:text="${concluido} ? 'Concluído ✓' : 'Marcar como concluído'">Marcar como concluído</button>
            </form>
            <a class="btn btn-outline-secondary" th:href="@{/modulos/{id}(id=${conteudo.modulo.id})}">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar ao módulo
            </a>
            <a th:if="${proximo}" class="btn btn-outline-primary ms-sm-auto" th:href="@{/conteudos/{id}(id=${proximo.id})}">
                Próximo conteúdo <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
            </a>
        </div>
    </div>
</main>
</body>
</html>
