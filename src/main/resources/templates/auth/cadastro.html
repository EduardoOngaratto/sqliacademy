<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Cadastro · SQLi Academy</title>
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h1 class="h3 mb-4">Criar conta</h1>

            <!-- novalidate: a validacao fica no servidor (Bean Validation) -->
            <form method="post" th:action="@{/cadastro}" th:object="${cadastroForm}" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <!-- Campos de senha sem th:field para a senha nao voltar preenchida no HTML -->
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                    <div class="form-text">Entre 8 e 64 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmacaoSenha" class="form-label">Confirmação de senha</label>
                    <input type="password" class="form-control" id="confirmacaoSenha" name="confirmacaoSenha"
                           th:classappend="${#fields.hasErrors('confirmacaoSenha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{confirmacaoSenha}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </form>

            <p class="mt-3 text-center">
                Já tem conta? <a th:href="@{/login}">Entrar</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
