<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SQLi Academy</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/trilha}">Trilha</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
            </ul>
            <!-- Logout do Spring Security e por POST (o th:action inclui o token CSRF).
                 Fica dentro de .navbar-nav para o botao herdar a cor dos links da navbar. -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <form method="post" th:action="@{/logout}">
                        <button type="submit" class="nav-link">Sair</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="rodape" class="border-top bg-body-tertiary py-3">
    <div class="container text-center text-body-secondary small">
        SQLi Academy · TCC de Ciência da Computação — URI Erechim · 2026
    </div>
</footer>

</body>
</html>
