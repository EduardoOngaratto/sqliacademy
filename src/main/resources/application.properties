spring.application.name=sqliacademy

# Banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/sqli_academy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usuario administrador criado pela carga inicial (senha via variavel de ambiente ADMIN_PASSWORD)
sqliacademy.admin.nome=Administrador
sqliacademy.admin.email=admin@sqliacademy.local
sqliacademy.admin.senha=${ADMIN_PASSWORD:}
