<!DOCTYPE html>
<!-- Exibida pelo Spring Boot para respostas 403 (acesso negado ou token CSRF invalido) -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Acesso negado · SQLi Academy</title>
</head>
<body>
<main class="container auth-wrapper">
    <div class="card auth-card text-center">
        <div class="card-body p-4 p-sm-5">
            <span class="icon-box icon-box-lg icon-box-alerta mb-3"><i class="bi bi-shield-x" aria-hidden="true"></i></span>
            <h1 class="h3">Acesso negado</h1>
            <p class="text-body-secondary mt-2 mb-4">
                Você não tem permissão para acessar esta página ou sua sessão expirou.
            </p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a class="btn btn-primary" th:href="@{/}">Página inicial</a>
                <a class="btn btn-outline-secondary" th:href="@{/login}">Entrar novamente</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
