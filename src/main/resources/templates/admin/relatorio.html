<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Relatório · SQLi Academy</title>
</head>
<body>
<main class="container py-4 py-md-5">
    <div class="page-header d-flex gap-3 align-items-center">
        <span class="icon-box icon-box-navy"><i class="bi bi-people-fill" aria-hidden="true"></i></span>
        <div>
            <h1 class="h3 mb-1">Relatório dos alunos</h1>
            <p class="page-subtitle" th:text="|${#lists.size(linhas)} aluno(s) cadastrado(s)|">0 alunos</p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(linhas)}" class="alert alert-info d-flex align-items-center gap-2">
        <i class="bi bi-info-circle" aria-hidden="true"></i><span>Nenhum aluno cadastrado ainda.</span>
    </div>

    <div th:unless="${#lists.isEmpty(linhas)}" class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Aluno</th>
                    <th th:each="m : ${modulos}" th:text="|${m.modulo.ordem}. ${m.modulo.titulo}|">Módulo</th>
                    <th>Labs resolvidos</th>
                    <th class="text-end">Pontuação</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="linha : ${linhas}">
                    <td>
                        <div class="fw-semibold" th:text="${linha.usuario.nome}">Nome</div>
                        <div class="small text-body-secondary" th:text="${linha.usuario.email}">email</div>
                        <span th:unless="${linha.usuario.ativo}" class="status status-pendente mt-1">Inativo</span>
                    </td>
                    <td th:each="p : ${linha.trilha}" class="text-nowrap">
                        <span th:replace="~{layout/fragments :: status(${p.status})}"></span>
                        <div class="small text-body-secondary mt-1" th:text="|Conteúdos: ${p.conteudosLidos} de ${p.totalConteudos}|"></div>
                        <div class="small">
                            <i class="bi me-1" aria-hidden="true"
                               th:classappend="${p.labResolvido} ? 'bi-check-circle-fill text-success' : 'bi-circle text-body-secondary'"></i><span
                                th:text="${p.labResolvido} ? 'Lab: resolvido' : 'Lab: pendente'"></span>
                        </div>
                    </td>
                    <td th:text="|${linha.labsResolvidos} de ${#lists.size(linha.trilha)}|">0 de 3</td>
                    <td class="text-end fw-semibold" th:text="|${linha.pontuacao} de ${pontuacaoMaxima}|">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
