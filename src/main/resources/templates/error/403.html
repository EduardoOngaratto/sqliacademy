<!DOCTYPE html>
<!-- Exibida pelo Spring Boot para respostas 403 (acesso negado ou token CSRF invalido) -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Acesso negado · SQLi Academy</title>
</head>
<body>
<main class="container py-5">
    <div class="p-5 bg-body-tertiary rounded-3 text-center">
        <h1 class="display-6 fw-bold">Acesso negado</h1>
        <p class="fs-5 mt-3">
            Você não tem permissão para acessar esta página ou sua sessão expirou.
        </p>
        <a class="btn btn-primary" th:href="@{/}">Página inicial</a>
        <a class="btn btn-outline-secondary" th:href="@{/login}">Entrar novamente</a>
    </div>
</main>
</body>
</html>
